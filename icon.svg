<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2238"/>
      <stop offset="100%" stop-color="#04070f"/>
    </radialGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0033aa"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ff0044"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" stroke="#00d4ff" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- Exhaust plume -->
  <path d="M 230 350 Q 256 460 256 470 Q 256 460 282 350 Z" fill="url(#flame)" filter="url(#glow)"/>

  <!-- Rocket Body -->
  <path d="M 256 70 Q 290 180 290 320 L 222 320 Q 222 180 256 70 Z" fill="url(#rocket)"/>

  <!-- Wings -->
  <path d="M 222 260 L 140 340 L 222 330 Z" fill="#0055aa"/>
  <path d="M 290 260 L 372 340 L 290 330 Z" fill="#0055aa"/>

  <!-- Cockpit Glass Window -->
  <ellipse cx="256" cy="180" rx="18" ry="32" fill="#00ffff" filter="url(#glow)"/>
</svg>
